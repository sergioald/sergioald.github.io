<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Meander morphology classifier workflow</title><desc id="desc">Workflow diagram showing centreline geometry, curvature spectrum, autoencoder latent space, clustering and Streamlit reporting.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><linearGradient id="river" x1="0" x2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs><rect width="900" height="520" rx="32" fill="url(#bg)"/><g filter="url(#shadow)"><rect x="55" y="65" width="790" height="390" rx="26" fill="#ffffff" opacity="0.94"/></g><text x="80" y="110" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Meander Morphology Classifier</text><text x="80" y="140" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="15">Centreline geometry → CWT spectra → autoencoder latent space → morphology classes</text><path d="M90 245 C145 165, 210 340, 280 245 S415 150, 480 250 S615 350, 685 245 S775 170, 815 250" fill="none" stroke="url(#river)" stroke-width="18" stroke-linecap="round"/><path d="M90 245 C145 165, 210 340, 280 245 S415 150, 480 250 S615 350, 685 245 S775 170, 815 250" fill="none" stroke="#eff6ff" stroke-width="5" stroke-linecap="round" opacity="0.85"/><g transform="translate(90,310)"><rect width="160" height="88" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="18" y="32" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Centreline</text><text x="18" y="56" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">x, y, width</text><text x="18" y="74" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">curvature extraction</text></g><g transform="translate(280,310)"><rect width="160" height="88" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="18" y="32" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">CWT spectra</text><text x="18" y="56" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">curvature energy</text><text x="18" y="74" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">ridge / trough logic</text></g><g transform="translate(470,310)"><rect width="160" height="88" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="18" y="32" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Autoencoder</text><text x="18" y="56" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">latent coordinates</text><text x="18" y="74" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">models via Zenodo</text></g><g transform="translate(660,310)"><rect width="160" height="88" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="18" y="32" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Classification</text><text x="18" y="56" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">clusters / labels</text><text x="18" y="74" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="12">Streamlit review</text></g><g opacity="0.85"><circle cx="550" cy="205" r="8" fill="#2563eb"/><circle cx="585" cy="185" r="7" fill="#2563eb"/><circle cx="615" cy="215" r="8" fill="#2563eb"/><circle cx="665" cy="178" r="8" fill="#06b6d4"/><circle cx="700" cy="205" r="7" fill="#06b6d4"/><circle cx="725" cy="175" r="8" fill="#06b6d4"/><circle cx="640" cy="250" r="7" fill="#7c3aed"/><circle cx="685" cy="260" r="8" fill="#7c3aed"/></g><g opacity="0.78"><rect x="315" y="165" width="120" height="90" rx="14" fill="#eef2ff" stroke="#c7d2fe"/><path d="M330 240 L350 2